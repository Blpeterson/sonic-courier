name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PortAudio on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,live]"
      - name: Verify PyAudio import and CLI launcher
        run: python -c "import pyaudio; print('PyAudio', pyaudio.__version__)" && sonic-courier --version
      - name: Run tests
        run: python -m pytest
      - name: Run linter
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
