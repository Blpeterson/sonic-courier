name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PortAudio on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,live]"
      - name: Verify PyAudio import and CLI launcher
        run: python -c "import pyaudio, numpy; print('PyAudio', pyaudio.__version__, 'NumPy', numpy.__version__); assert tuple(map(int, numpy.__version__.split('.')[:2])) < (2, 4)" && sonic-courier --version
      - name: Run tests
        run: python -m pytest
      - name: Run linter
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

  debian-13:
    runs-on: ubuntu-latest
    container: debian:13-slim

    steps:
      - name: Install Debian system dependencies
        run: apt-get update && apt-get install -y git python3 python3-venv python3-pip portaudio19-dev
      - uses: actions/checkout@v5
      - name: Install Sonic Courier on Debian 13
        run: python3 -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install ".[dev,live]"
      - name: Verify compatible native dependencies and launcher
        run: .venv/bin/python -c "import pyaudio, numpy; print('PyAudio', pyaudio.__version__, 'NumPy', numpy.__version__); assert tuple(map(int, numpy.__version__.split('.')[:2])) < (2, 4)" && .venv/bin/sonic-courier --version
      - name: Run tests and linter
        run: .venv/bin/python -m pytest && .venv/bin/ruff check .
      - name: Build wheel
        run: .venv/bin/python -m pip wheel . --no-deps --wheel-dir dist
