[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-courier"
version = "1.0.0"
description = "Send files through near-ultrasonic audio using relative 16-tone FSK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brack Peterson" }]
dependencies = ["numpy>=1.24"]
keywords = ["audio", "data-transfer", "fsk", "ultrasonic", "modem"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
live = ["PyAudio>=0.2.14"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
sonic-courier = "sonic_courier.cli:main"

[tool.setuptools.packages.find]
include = ["sonic_courier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
